<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>検索 - Deep Navi</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
  <a href="./index.html" class="back-button">←</a>
  <h1>検索</h1>
  <div style="width:28px;"></div>
</header>
    <main class="app-content">
      <div class="search-bar-container">
  <img src="./images/icon-menu.png" alt="メニュー" style="width: 20px; height: 20px;" onerror="this.outerHTML='☰'">
  <input type="text" class="search-input" value="夕日パーク" placeholder="検索">
  <img src="./images/icon-search.png" alt="検索" style="width: 20px; height: 20px;" onerror="this.outerHTML='🔍'">
</div>

<a href="./ad.html" class="spot-card">
  <div class="spot-card-header">
    <div class="spot-card-img">
      <img src="./images/spot-yuuhi.png" alt="夕日パーク" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
      <span class="img-placeholder-text">spot-yuuhi</span>
    </div>
    <div class="spot-card-info">
      <div class="spot-title">夕日パーク</div>
      <div class="spot-meta">営業時間 5:30〜10:00</div>
      <div class="spot-meta">駐車場・トイレ・電話：24時間利用可能</div>
    </div>
  </div>
</a>

<div class="map-container">
  <img src="./images/map-search.png" alt="検索地図" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
  <div class="img-placeholder-text" style="font-size: 16px; text-align: center;">
    [ 地図領域 ]<br>📍 サンプル町1-1 (夕日パーク)
  </div>
</div>
    </main>
  </div>
  <script src="./script.js"></script>
</body>
</html>
