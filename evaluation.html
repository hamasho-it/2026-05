<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今回のナビ評価</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-viewport">
    <header class="app-header">
      <a href="./index.html" class="back-btn-fixed">戻る</a>
      <h1 class="app-title" style="margin-left: auto; margin-right: auto;">今回のナビ評価</h1>
    </header>

    <main class="app-content" style="justify-content: space-between;">
      <div>
        <p style="text-align: center; margin-top: 14px; font-size: 16px; font-weight: bold; color: var(--text-dark);">今回のナビの満足度を教えてください</p>
        
        <div class="star-rating">
          <span>★</span><span>★</span><span>★</span><span>★</span><span>☆</span>
        </div>

        <div class="form-group">
          <label class="form-label">コメント</label>
          <textarea class="form-input" placeholder="ご感想を入力してください">地元の人しか知らない裏道を通れてスムーズに到着できました！</textarea>
        </div>
      </div>

      <div style="margin-bottom: 20px;">
        <a href="./index.html" class="btn-neon">ホームに戻る</a>
      </div>
    </main>
  </div>
  <script src="./script.js"></script>
</body>
</html>
