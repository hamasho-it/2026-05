<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ナビ画面</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-viewport">
    <header class="app-header">
      <a href="./search.html" class="back-btn-fixed">戻る</a>
      <h1 class="app-title" style="margin-left: auto; margin-right: auto;">ナビ画面</h1>
    </header>

    <main class="app-content">
      <div style="background: linear-gradient(135deg, #00C7FF, #007AFF); color: #FFF; padding: 18px; border-radius: var(--radius-lg); margin-bottom: 16px; box-shadow: 0 8px 25px rgba(0, 122, 255, 0.3);">
        <p style="font-size: 13px; font-weight: bold; opacity: 0.9;">ルート案内</p>
        <p style="font-size: 17px; font-weight: 900; margin-top: 4px;">300m先「サンプル交差点」を右折してください</p>
      </div>

      <div class="img-container" style="flex: 1; min-height: 280px; margin-bottom: 16px;">
        <img src="./images/map-navigation.png" alt="ナビ地図" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="img-fallback" style="height: 100%; width: 100%; display: none; flex-direction: column;">
          <span style="font-size: 40px;">📍</span>
          <span>進行ルート表示ナビ地図</span>
        </div>
      </div>

      <a href="./arrival.html" class="btn-neon btn-secondary-neon">目的地到着</a>
    </main>
  </div>
  <script src="./script.js"></script>
</body>
</html>
