<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お気に入りスポット</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-viewport">
    <header class="app-header">
      <a href="./index.html" class="back-btn-fixed">戻る</a>
      <h1 class="app-title" style="margin-left: auto; margin-right: auto;">お気に入りスポット</h1>
    </header>

    <main class="app-content">
      <div class="fav-grid">
        <div class="fav-card">
          <div class="fav-badge">★</div>
          <img src="./images/thumb-fav1.png" alt="サムネイル1" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
          <div class="img-fallback" style="height:100%;">夕日パーク</div>
        </div>
        <div class="fav-card">
          <div class="fav-badge">★</div>
          <img src="./images/thumb-fav2.png" alt="サムネイル2" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
          <div class="img-fallback" style="height:100%;">サンプル商店</div>
        </div>
        <div class="fav-card">
          <div class="fav-badge">★</div>
          <img src="./images/thumb-fav3.png" alt="サムネイル3" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
          <div class="img-fallback" style="height:100%;">隠れ展望台</div>
        </div>
        <div class="fav-card">
          <div class="fav-badge">★</div>
          <img src="./images/thumb-fav4.png" alt="サムネイル4" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
          <div class="img-fallback" style="height:100%;">サンプル海岸</div>
        </div>
      </div>
    </main>
  </div>
  <script src="./script.js"></script>
</body>
</html>
